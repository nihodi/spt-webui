[project]
name = "spt-webui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "oauthlib>=3.3.1",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.0",
    "requests-oauthlib>=2.0.0",
    "sentry-sdk>=2.68.1",
    "setuptools>=84.0.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
spt_webui_backend = "spt_webui_backend.__main__:main"


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
"*" = ["*.ini"]
